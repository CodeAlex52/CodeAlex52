# 贡献贪吃蛇自动生成工作流
# 每天生成一次贪吃蛇动画 SVG，并推送到本仓库的 output 分支
# README 中的 <picture> 引用的正是 output 分支下的这两个文件：
#   - github-contribution-grid-snake.svg       （浅色主题）
#   - github-contribution-grid-snake-dark.svg  （深色主题）

name: Generate Contribution Snake

on:
  schedule:
    # 每天 UTC 00:30（北京时间 08:30）运行一次，保证贪吃蛇数据每日更新
    - cron: '30 0 * * *'
  workflow_dispatch:   # 允许在 Actions 页面手动触发（首次部署用它）
  push:
    branches:
      - main           # 部署本文件推送到 main 时会自动跑第一次
    paths-ignore:
      # 统计卡工作流提交的目录不触发贪吃蛇重新生成，节约运行次数
      - 'profile-summary-card-output/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 生成贪吃蛇 SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 推送 SVG 到 output 分支
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
