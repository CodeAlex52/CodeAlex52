# GitHub 统计卡自动生成工作流
#
# 用 vn7n24fzkq/github-profile-summary-cards 在本仓库内生成统计卡 SVG，
# 直接提交到 main 分支的 profile-summary-card-output/<主题名>/ 目录下。
# 不依赖任何第三方公共部署服务，彻底解决公共实例限流导致的裂图问题。
#
# README 中引用的两个主题：
#   - profile-summary-card-output/tokyonight/*.svg  （深色模式）
#   - profile-summary-card-output/github/*.svg      （浅色模式）

name: Generate GitHub Stats Cards

on:
  schedule:
    # 每天 UTC 00:10（北京时间 08:10）刷新一次统计数据
    - cron: '10 0 * * *'
  workflow_dispatch:   # 支持在 Actions 页面手动触发
  push:
    branches:
      - main
    paths-ignore:
      # 卡片文件由本工作流自己提交，忽略它们避免无限循环触发
      - 'profile-summary-card-output/**'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: 生成统计卡（一次输出全部主题）
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # 内置 token 即可读取公开数据并推送到本仓库；
          # 若运行失败，可改用自己的 PAT：
          #   Settings → Secrets → 新建 SUMMARY_GITHUB_TOKEN，然后下面替换之
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main     # 卡片直接提交到 main 的 profile-summary-card-output 目录
          UTC_OFFSET: 8         # 按北京时间统计
